<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>nano_world_model 数据预览 + GameNGen 试玩</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --fg: #e6e9ef; --dim: #9aa3b2; --accent: #7aa2f7; --warn: #e0af68;
    --ok: #9ece6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  header { padding: 22px 28px 14px; }
  h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 13px; max-width: 940px; }
  .sub code { background: #1e222b; padding: 1px 5px; border-radius: 3px; font-size: 12px; }

  /* 两级标签：上面是「在线试玩 / 数据预览」，下面才是数据的四个来源。
     这两者不是并列关系，平铺成一排会让人以为 bots 和试玩是同一层的东西。 */
  #tabs { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 28px 12px; }
  #tabs button { background: transparent; color: var(--dim); border: none;
                 border-bottom: 2px solid transparent; padding: 8px 4px;
                 cursor: pointer; font-size: 15px; font-weight: 600; }
  #tabs button:hover { color: var(--fg); }
  #tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }

  #subtabs { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 28px 14px;
             border-bottom: 1px solid var(--line); }
  #subtabs.hide { display: none; }
  #subtabs button { background: var(--panel); color: var(--dim); border: 1px solid var(--line);
                    padding: 6px 13px; border-radius: 999px; cursor: pointer; font-size: 13px; }
  #subtabs button:hover { color: var(--fg); border-color: var(--accent); }
  #subtabs button.on { background: var(--accent); color: #0f1115;
                       border-color: var(--accent); font-weight: 600; }
  #subtabs .sep { width: 1px; background: var(--line); margin: 4px 6px; }
  /* 试玩那一页没有二级标签，但顶部仍要有分隔线 */
  #tabs.solo { border-bottom: 1px solid var(--line); padding-bottom: 12px; }

  #controls { position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
              gap: 18px; flex-wrap: wrap; padding: 12px 28px;
              background: rgba(15,17,21,.96); border-bottom: 1px solid var(--line);
              backdrop-filter: blur(6px); }
  #controls button, .btn {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #controls button:hover, .btn:hover { border-color: var(--accent); }
  label { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 150px; accent-color: var(--accent); }
  .val { color: var(--fg); font-variant-numeric: tabular-nums; min-width: 46px; }

  main { padding: 22px 28px 60px; }
  h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
  h2 .tag { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px;
            font-family: ui-monospace, Menlo, monospace; }
  h3 { margin: 26px 0 4px; font-size: 14px; font-weight: 600; color: var(--fg); }
  .note { color: var(--dim); margin: 0 0 20px; font-size: 13px; max-width: 900px; }
  .vidbox { border-bottom: 1px solid var(--line); padding-bottom: 6px; }

  .clip { display: flex; gap: 22px; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; }
  .panel { display: flex; flex-direction: column; gap: 6px; }
  .cap { color: var(--dim); font-size: 12px; }
  .film { width: 256px; height: 256px; image-rendering: pixelated;
          border: 1px solid var(--line); border-radius: 4px;
          background-repeat: no-repeat; background-size: auto 256px; }
  .meta { font-size: 12px; color: var(--dim); min-width: 280px; }
  .meta b { color: var(--fg); font-weight: 600; }
  .meta .row { margin-bottom: 3px; }
  .acts { font-family: ui-monospace, Menlo, monospace; font-size: 11px;
          color: var(--dim); line-height: 1.9; margin-top: 8px; }
  .acts span { background: #1e222b; padding: 1px 4px; border-radius: 3px; margin-right: 3px; }
  .acts span.now { background: var(--accent); color: #0f1115; }
  .hint { color: var(--warn); font-size: 12px; margin-top: 8px; }

  /* --- 试玩 --- */
  #screen { width: 640px; height: 512px; image-rendering: pixelated; display: block;
            border: 1px solid var(--line); border-radius: 4px; background: #000; cursor: pointer; }
  #screen.locked { cursor: none; border-color: var(--accent); }
  .gamewrap { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  /* 两栏都要钉死宽度：不钉的话栏内那两段说明文字会把栏撑到 900px 上下，
     两栏加起来超过容器就换行，右栏掉到画面底下去。 */
  .gamecol { flex: 0 0 640px; width: 640px; }
  .gamecol .note { max-width: 640px; }
  .stats { font-family: ui-monospace, Menlo, monospace; font-size: 12px;
           color: var(--dim); flex: 0 1 420px; max-width: 420px; }
  .stats .note { max-width: 420px; }
  .stats b { color: var(--fg); }
  .stats .big { font-size: 26px; color: var(--ok); font-weight: 600; }
  .keys { display: grid; grid-template-columns: 84px 1fr; gap: 3px 12px;
          font-size: 12px; color: var(--dim); margin-top: 12px; }
  .keys kbd { background: #1e222b; border: 1px solid var(--line); border-bottom-width: 2px;
              border-radius: 4px; padding: 1px 6px; font-family: ui-monospace, Menlo, monospace; }
  /* top/left 必须写：absolute 元素不给偏移就落在静态位置，也就是掉到 canvas 下面 */
  #overlay { position: absolute; top: 0; left: 0; width: 640px; height: 512px; display: flex;
             align-items: center; justify-content: center; text-align: center;
             background: rgba(15,17,21,.82); color: var(--fg); font-size: 15px;
             border-radius: 4px; pointer-events: none; }
  .rel { position: relative; width: 640px; }
  .modelbar { border: 1px solid var(--line); border-radius: 6px;
              padding: 12px 14px; margin-bottom: 14px; background: #13161c; }
  .bar { height: 6px; background: #1e222b; border-radius: 3px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }
  #g-running { margin-top: 10px; padding: 8px 12px; border-radius: 5px;
               background: #1a2030; border-left: 3px solid var(--ok);
               font-size: 13px; color: var(--dim); }
  #g-running b { color: var(--ok); font-size: 15px; }
  #g-running.stale { border-left-color: var(--warn); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px;
          color: var(--dim); }
  .bad { color: #f7768e; }
</style>
</head>
<body>
<header>
  <h1>nano_world_model — 数据预览 &amp; GameNGen 在线试玩</h1>
</header>

<div id="tabs"></div>
<div id="subtabs"></div>

<div id="controls">
  <button id="play">⏸ 暂停</button>
  <label>速度 <input type="range" id="fps" min="1" max="35" value="8"><span class="val" id="fpsv">8 fps</span></label>
  <label>帧 <input type="range" id="frame" min="0" max="16" value="0"><span class="val" id="framev">0 / 16</span></label>
  <span class="sub" style="margin-left:auto">拖「帧」可逐帧对比</span>
</div>

<main id="main">
  <section id="game" style="display:none">
    <h2>在线试玩：GameNGen 复现模型<span class="tag" id="g-gpu">…</span></h2>
    <div class="gamewrap">
      <div class="gamecol">
        <div class="modelbar">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <label style="white-space:nowrap">模型</label>
            <select class="btn" id="g-model" style="flex:1;min-width:240px"></select>
            <button class="btn" id="g-loadmodel">载入</button>
          </div>
          <p class="note" id="g-modelnote" style="margin:6px 0 0;font-size:12px"></p>
          <p class="mono" id="g-stale" style="margin:2px 0 0;color:var(--warn)"></p>
          <div id="g-progwrap" style="display:none;margin-top:8px">
            <div class="bar"><div class="fill" id="g-progfill"></div></div>
            <div class="mono" id="g-progtext" style="margin-top:4px"></div>
          </div>
          <div id="g-running">当前正在玩：<b id="g-runname">—</b></div>
        </div>

        <div class="rel">
          <canvas id="screen" width="320" height="256"></canvas>
          <div id="overlay">点击画面开始 · 按键才生成，松手定格 · Esc 退出</div>
        </div>
        <div style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <button class="btn" id="g-new">↻ 新开一局</button>
          <label>速度
            <select class="btn" id="g-speed">
              <option value="1">全速</option>
              <option value="0.5">0.5 倍速</option>
              <option value="0.25">0.25 倍速</option>
            </select>
          </label>
        </div>
        <div style="margin-top:8px;display:flex;gap:8px;align-items:center">
          <label style="white-space:nowrap">推理服务</label>
          <input id="g-api" class="btn" style="flex:1;min-width:200px;font-family:ui-monospace,Menlo,monospace"
                 placeholder="http://主机:25677">
          <button class="btn" id="g-apply">切换</button>
        </div>
      </div>

      <div class="stats">
        <div class="big" id="g-fps">— fps</div>
        <div class="row">每帧 <b id="g-ms">—</b> ms &nbsp;·&nbsp; 已生成 <b id="g-steps">0</b> 帧</div>
        <div class="row">当前动作 <b id="g-act">—</b></div>
        <div class="row" id="g-bench" style="margin-top:8px"></div>
        <div class="row bad" id="g-err"></div>

        <div class="keys">
          <span><kbd>鼠标左右</kbd></span><span>转向</span>
          <span><kbd>W</kbd></span><span>前进</span>
          <span><kbd>S</kbd></span><span>后退</span>
          <span><kbd>A</kbd> <kbd>D</kbd></span><span>左右平移</span>
          <span><kbd>空格</kbd></span><span>无动作，走一帧</span>
          <span><kbd>鼠标左键</kbd></span><span>开火</span>
          <span><kbd>Esc</kbd></span><span>松开鼠标</span>
        </div>
      </div>
    </div>
  </section>
</main>

<script>
const RES = 128, SCALE = 2;
let T = 17, frame = 0, playing = true, fps = 8, last = 0;
let sections = [], active = 0, lastData = 1;   // lastData: 数据预览里上次看的来源

function panel(cap, src) {
  const d = document.createElement('div');
  d.className = 'panel';
  d.innerHTML = `<div class="cap">${cap}</div>`;
  const f = document.createElement('div');
  f.className = 'film';
  f.style.backgroundImage = `url("${src}")`;
  d.appendChild(f);
  return [d, f];
}

/* ==================== 试玩 ==================== */
// 推理服务地址可切换：默认同主机 :25677（本机 4060 Ti），也可以指到别的机器
// （比如 1202b 的 A6000）。存在 localStorage，刷新后还在。
let GAME_API = localStorage.getItem('gamengen_api')
            || `http://${location.hostname}:25677`;
const G = {
  sid: null, locked: false, stepping: false, speed: 1, steps: 0,
  keys: new Set(), dx: 0, fire: false, times: [],
  loaded: null,      // 显存里真正装着的模型 id
  stale: false,      // 下拉框选的和 loaded 不一致 —— 此时禁止游玩
};

const TURN_DEADZONE = 6;      // 鼠标累计位移超过这个才算转向，免得手一抖就转

function pickAction() {
  let turn = 0;
  if (G.dx >  TURN_DEADZONE) turn =  1;
  if (G.dx < -TURN_DEADZONE) turn = -1;
  G.dx = 0;
  const fwd = G.keys.has('w'), back = G.keys.has('s');
  const left = G.keys.has('a'), right = G.keys.has('d');
  // 开火独占，和上游动作表一致
  if (G.fire) { G.fire = false; return 11; }
  if (G.keys.has(' ') && !fwd && !back && !left && !right && !turn) return 0;  // 空格 = 无动作走一帧
  if (turn < 0 && fwd)  return 9;
  if (turn > 0 && fwd)  return 10;
  if (turn < 0 && back) return 4;
  if (turn > 0 && back) return 5;
  if (turn < 0) return 1;
  if (turn > 0) return 2;
  if (fwd)  return 8;
  if (back) return 3;
  if (left)  return 7;
  if (right) return 6;
  return 0;
}

const $ = id => document.getElementById(id);

function drawFrame(dataUrl) {
  const img = new Image();
  img.onload = () => $('screen').getContext('2d').drawImage(img, 0, 0);
  img.src = dataUrl;
}

async function gameNew() {
  $('g-err').textContent = '';
  try {
    const r = await fetch(GAME_API + '/new', {method: 'POST', body: JSON.stringify({})});
    const d = await r.json();
    G.sid = d.id; G.steps = 0; G.times = [];
    drawFrame(d.frame);
    $('g-steps').textContent = '0';
    $('g-fps').textContent = '— fps';
  } catch (e) {
    $('g-err').innerHTML = `<span class="bad">连不上推理服务 ${GAME_API}。`
      + `请确认 gamengen/server.py 在跑。</span>`;
  }
}

// 有没有待处理的输入。没有就一帧都不生成——世界冻住。
// 这一条是整个交互的关键：模型是随机的，同样的上下文喂 NOOP 也会画出不同的下一帧，
// 所以「一直循环」等于「你不动它也自己漂」（实测连发 30 次 NOOP，第 30 帧与第 0 帧
// 平均差 11.66/255，墙的贴图都换了）。改成输入驱动之后，松手 = 状态定格。
function hasInput() {
  for (const k of ['w', 'a', 's', 'd', ' ']) if (G.keys.has(k)) return true;
  return G.fire || Math.abs(G.dx) > TURN_DEADZONE;
}

async function gameLoop() {
  if (!G.locked || G.stepping || G.stale) return;
  if (!hasInput()) return;                 // 松手就停在这里
  if (!G.sid) { await gameNew(); if (!G.sid) return; }
  G.stepping = true;
  const action = pickAction();
  const t0 = performance.now();
  try {
    const r = await fetch(GAME_API + '/step', {
      method: 'POST', body: JSON.stringify({id: G.sid, action})});
    if (r.status === 410) { G.sid = null; G.stepping = false; return gameLoop(); }
    const d = await r.json();
    drawFrame(d.frame);
    G.steps = d.steps;
    const wall = performance.now() - t0;
    // 丢掉本局第一帧：它带着 cuDNN 自动调优和 GPU 升频的一次性成本，算进均值会
    // 让显示的 fps 长时间偏低一大截。服务端也已经预热过一帧，这里是双保险。
    if (G.steps > 0) { G.times.push(wall); if (G.times.length > 15) G.times.shift(); }
    const mean = G.times.length ? G.times.reduce((a, b) => a + b, 0) / G.times.length : wall;
    $('g-ms').textContent = d.ms.toFixed(0);
    $('g-steps').textContent = d.steps;
    $('g-act').textContent = d.action;
    $('g-fps').textContent = (1000 / mean * G.speed).toFixed(2) + ' fps';
    G.stepping = false;
    // 键还按着就接着走（连按/按住 = 连续生成），速度档在这里拉开间隔
    setTimeout(gameLoop, Math.max(0, (1 / G.speed - 1) * wall));
  } catch (e) {
    $('g-err').innerHTML = '<span class="bad">推理请求失败，已停。</span>';
    G.stepping = false;
  }
}

function initGame() {
  const cv = $('screen');
  cv.onclick = () => { if (!G.stale) cv.requestPointerLock(); };
  document.addEventListener('pointerlockchange', () => {
    const locked = document.pointerLockElement === cv;
    cv.classList.toggle('locked', locked);
    $('overlay').style.display = locked ? 'none' : 'flex';
    G.locked = locked;
  });
  document.addEventListener('mousemove', e => {
    if (document.pointerLockElement === cv) { G.dx += e.movementX; gameLoop(); }
  });
  document.addEventListener('mousedown', e => {
    if (document.pointerLockElement === cv && e.button === 0) { G.fire = true; gameLoop(); }
  });
  addEventListener('keydown', e => {
    if (document.pointerLockElement === cv) {
      G.keys.add(e.key.toLowerCase());
      if (['w','a','s','d',' '].includes(e.key.toLowerCase())) e.preventDefault();
      gameLoop();
    }
  });
  addEventListener('keyup', e => G.keys.delete(e.key.toLowerCase()));
  $('g-new').onclick = gameNew;
  $('g-loadmodel').onclick = loadModel;
  $('g-api').value = GAME_API;
  $('g-apply').onclick = () => {
    GAME_API = $('g-api').value.replace(/\/+$/, '');
    localStorage.setItem('gamengen_api', GAME_API);
    G.sid = null;
    probeServer();
  };
  $('g-model').onchange = () => { showModelNote(); syncModelState(); };
  $('g-speed').onchange = e => { G.speed = +e.target.value; };

  probeServer();
}

let MODELS = [];

function fillModels(list, loaded) {
  const sel = document.getElementById('g-model');
  MODELS = list || [];
  sel.innerHTML = MODELS.map(m =>
    `<option value="${m.id}"${m.id === loaded ? ' selected' : ''}>${m.name}</option>`).join('');
  showModelNote();
}

// 下拉框选的 ≠ 显存里装的，就把游玩彻底掐掉。
// 不掐的话会出现「界面写着 A、实际在跑 B」——玩家看到的画面和他以为的模型对不上，
// 比慢、比丑都严重，因为它让人得出错误结论。
function syncModelState() {
  const sel = document.getElementById('g-model');
  G.stale = !!G.loaded && sel.value !== G.loaded;
  const btn = document.getElementById('g-loadmodel');
  btn.style.borderColor = G.stale ? 'var(--warn)' : '';
  btn.style.color = G.stale ? 'var(--warn)' : '';
  document.getElementById('g-stale').textContent =
    G.stale ? '↑ 选了别的模型，点「载入」后才能玩' : '';
  const run = document.getElementById('g-running');
  document.getElementById('g-runname').textContent = G.loadedName || '—';
  run.className = G.stale ? 'stale' : '';
  run.firstChild.textContent = G.stale ? '仍在玩（未切换）：' : '当前正在玩：';
  if (G.stale) {
    document.exitPointerLock();
    document.getElementById('overlay').textContent = '先点「载入」把选中的模型装进显存';
  } else {
    document.getElementById('overlay').textContent =
      '点击画面开始 · 按键才生成，松手定格 · Esc 退出';
  }
}

function showModelNote() {
  const id = document.getElementById('g-model').value;
  const m = MODELS.find(x => x.id === id);
  document.getElementById('g-modelnote').innerHTML = m
    ? `${m.note} <a href="${m.repo}" style="color:var(--accent)">权重</a>` : '';
}

async function loadModel() {
  const $ = id => document.getElementById(id);
  const id = $('g-model').value;
  const btn = $('g-loadmodel');
  G.sid = null;
  btn.disabled = true; btn.textContent = '载入中…';
  $('g-err').textContent = '';
  $('g-progwrap').style.display = '';
  // 真进度：/status 不排队进 GPU 线程，所以 GPU 忙着时也读得到当前阶段。
  const t0 = performance.now();
  const poll = setInterval(async () => {
    try {
      const p = await (await fetch(GAME_API + '/status')).json();
      const pct = p.total ? Math.round(100 * p.done / p.total) : 8;
      $('g-progfill').style.width = pct + '%';
      $('g-progtext').textContent =
        `${p.phase || '准备中'}${p.total ? ` ${p.done}/${p.total}` : ''}`
        + ` · ${((performance.now() - t0) / 1000).toFixed(1)}s`;
    } catch (e) { /* 载入期间偶发连不上，忽略 */ }
  }, 250);
  try {
    const r = await fetch(GAME_API + '/load', {method: 'POST', body: JSON.stringify({id})});
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    $('g-progfill').style.width = '100%';
    probeServer();
  } catch (e) {
    $('g-err').innerHTML = `<span class="bad">载入失败：${e.message}</span>`;
  } finally {
    clearInterval(poll);
    setTimeout(() => { $('g-progwrap').style.display = 'none';
                       $('g-progfill').style.width = '0%'; }, 600);
    btn.disabled = false; btn.textContent = '载入';
  }
}

function probeServer() {
  const $ = id => document.getElementById(id);
  fetch(GAME_API + '/info').then(r => r.json()).then(d => {
    fillModels(d.models, d.loaded);
    G.loaded = d.loaded;
    G.loadedName = (MODELS.find(m => m.id === d.loaded) || {}).name || d.loaded;
    $('g-gpu').textContent =
      `${d.gpu} · ${d.steps} 步去噪 · ${d.res} · 上下文 ${d.buffer} 帧`;
    syncModelState();
    if (d.bench) {
      $('g-bench').innerHTML =
        `启动基准（${d.bench.n} 帧连续前进）：<b>${d.bench.mean_ms} ms/帧</b> = `
        + `<b>${d.bench.fps} fps</b>，抖动 ${d.bench.min_ms}–${d.bench.max_ms} ms`;
    }
    gameNew();
  }).catch(() => {
    $('g-gpu').textContent = '推理服务未启动';
    $('g-err').innerHTML = `<span class="bad">连不上 ${GAME_API}</span>`;
  });
}

/* ==================== 数据预览 ==================== */
Promise.all([
  fetch('outputs/manifest.json').then(r => r.json()),
  fetch('outputs/videos.json').then(r => r.json()).catch(() => ({})),
]).then(([groups, vids]) => {
  const main = document.getElementById('main');
  const tabs = document.getElementById('tabs');

  const subtabs = document.getElementById('subtabs');

  // 一级：试玩 / 数据预览
  const playBtn = document.createElement('button');
  playBtn.textContent = '🎮 在线试玩';
  playBtn.onclick = () => show(0);
  const dataBtn = document.createElement('button');
  dataBtn.textContent = '📊 数据预览';
  dataBtn.onclick = () => show(lastData);   // 回到上次看的那个来源
  tabs.append(playBtn, dataBtn);
  sections.push({sec: $('game'), btn: playBtn, films: [], actEls: [], isGame: true});

  // 二级：数据的四个来源
  groups.forEach((g, gi) => {
    if (gi === 1) {
      const sep = document.createElement('div'); sep.className = 'sep'; subtabs.appendChild(sep);
    }
    const btn = document.createElement('button');
    btn.textContent = g.title.replace(/^(下载|本地录制)：/, '');
    btn.title = g.id;
    const myIndex = sections.length;
    btn.onclick = () => show(myIndex);
    subtabs.appendChild(btn);

    const sec = document.createElement('section');
    sec.style.display = 'none';
    sec.innerHTML = `<h2>${g.title}<span class="tag">${g.id}</span></h2>
                     <p class="note">${g.note}</p>`;

    const v = vids[g.id.replace(/^rec_/, '')];
    const vbox = document.createElement('div');
    vbox.className = 'vidbox';
    if (v) {
      vbox.innerHTML = `
        <h3>录像本身</h3>
        <p class="note">整集 <b>${v.episode_frames}</b> 帧 / ${v.episode_seconds} 秒，
           这里放开头 <b>${v.seconds}</b> 秒。开头两秒的白雾是 9 个角色挤在同一出生点。</p>
        <div class="clip">
          <div class="panel"><div class="cap">录制器存下的原生画面 ${v.raw_res}</div>
            <video src="${v.raw}" controls loop muted playsinline
                   style="width:320px;border:1px solid var(--line);border-radius:4px"></video></div>
          <div class="panel"><div class="cap">缩到模型实际看到的 ${v.model_res}</div>
            <video src="${v.model}" controls loop muted playsinline
                   style="width:256px;image-rendering:pixelated;border:1px solid var(--line);border-radius:4px"></video></div>
        </div>`;
    } else {
      vbox.innerHTML = `
        <h3>录像本身</h3>
        <p class="note">无连续录像。存的是抽样过的 10 帧滑窗，展开后 shard_0 实测
           <b>152</b> 段碎片，中位 <b>23</b> 帧、最长 <b>59</b> 帧；≥17 帧的 99 段，≥129 帧的 <b>0</b> 段。</p>`;
    }
    sec.appendChild(vbox);

    const h = document.createElement('h3');
    h.textContent = '训练切片：原始 vs 编解码重建';
    const hn = document.createElement('p');
    hn.className = 'note';
    hn.textContent = '一段 = 17 帧 = 0.49 秒，模型一次吃这么多。';
    sec.append(h, hn);

    const films = [], actEls = [];
    for (const c of g.clips) {
      T = c.frames;
      const row = document.createElement('div');
      row.className = 'clip';
      const [p1, f1] = panel('原始', c.orig);
      const [p2, f2] = panel('encode → decode 重建', c.recon);
      films.push(f1, f2);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const uniqPct = (100 * c.uniq_codes / c.n_codes).toFixed(0);
      meta.innerHTML = `
        <div class="row">PSNR <b>${c.psnr} dB</b> · 平均绝对误差 <b>${c.mae}</b>/255</div>
        <div class="row">编码后 <b>${c.n_codes}</b> 个整数，不重复的 <b>${c.uniq_codes}</b>（${uniqPct}%）</div>
        <div class="row">${c.frames} 帧 × ${c.res}px</div>`;
      const acts = document.createElement('div');
      acts.className = 'acts';
      acts.innerHTML = c.actions.map(a => `<span>${a}</span>`).join('');
      meta.appendChild(acts);
      actEls.push(acts);
      if (c.uniq_codes / c.n_codes < 0.5) {
        const hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = '↑ 不重复的码不到一半（其余片段都在 1200 上下）';
        meta.appendChild(hint);
      }
      row.append(p1, p2, meta);
      sec.appendChild(row);
    }
    main.appendChild(sec);
    sections.push({ sec, btn, films, actEls });
  });

  const fslider = document.getElementById('frame');
  fslider.max = T - 1;

  function draw() {
    const s = sections[active];
    if (s.isGame) return;
    const off = -frame * RES * SCALE;
    for (const f of s.films) f.style.backgroundPosition = `${off}px 0`;
    for (const a of s.actEls) {
      const kids = a.children;
      for (let i = 0; i < kids.length; i++)
        kids[i].className = (i === frame) ? 'now' : '';
    }
    fslider.value = frame;
    document.getElementById('framev').textContent = `${frame} / ${T - 1}`;
  }

  function show(i) {
    const isGame = sections[i].isGame;
    sections.forEach((s, j) => {
      s.sec.style.display = (i === j) ? '' : 'none';
      if (j > 0) s.btn.className = (i === j) ? 'on' : '';   // 二级按钮
    });
    playBtn.className = isGame ? 'on' : '';
    dataBtn.className = isGame ? '' : 'on';
    subtabs.className = isGame ? 'hide' : '';
    tabs.className = isGame ? 'solo' : '';
    if (!isGame) lastData = i;
    active = i;
    // 逐帧播放那排控件对试玩没意义
    document.getElementById('controls').style.display = isGame ? 'none' : 'flex';
    if (!isGame) draw();
    window.scrollTo({ top: 0 });
  }

  function tick(ts) {
    if (playing && ts - last > 1000 / fps) { last = ts; frame = (frame + 1) % T; draw(); }
    requestAnimationFrame(tick);
  }
  initGame();
  show(0);
  requestAnimationFrame(tick);

  document.getElementById('play').onclick = e => {
    playing = !playing;
    e.target.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  };
  document.getElementById('fps').oninput = e => {
    fps = +e.target.value;
    document.getElementById('fpsv').textContent = fps + ' fps';
  };
  fslider.oninput = e => {
    playing = false;
    document.getElementById('play').textContent = '▶ 播放';
    frame = +e.target.value; draw();
  };
  document.onkeydown = e => {
    if (sections[active] && sections[active].isGame) return;
    if (e.key === 'ArrowLeft')  { playing = false; frame = (frame - 1 + T) % T; draw(); }
    if (e.key === 'ArrowRight') { playing = false; frame = (frame + 1) % T; draw(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight')
      document.getElementById('play').textContent = '▶ 播放';
  };
});
</script>
</body>
</html>
