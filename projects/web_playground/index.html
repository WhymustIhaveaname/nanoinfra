<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>nano_world_model GameNGen 在线试玩 + 数据预览</title>
<style>
  :root {
    --bg: #0f1115; --panel: #171a21; --line: #262b36;
    --fg: #e6e9ef; --dim: #9aa3b2; --accent: #7aa2f7; --warn: #e0af68;
    --ok: #9ece6a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--fg);
    font: 14px/1.6 -apple-system, "PingFang SC", "Noto Sans CJK SC", "Microsoft YaHei", sans-serif;
  }
  header { padding: 22px 28px 14px; }
  h1 { margin: 0 0 6px; font-size: 20px; font-weight: 600; }
  .sub { color: var(--dim); font-size: 13px; max-width: 940px; }
  .sub code { background: #1e222b; padding: 1px 5px; border-radius: 3px; font-size: 12px; }

  /* 两级标签：上面是「在线试玩 / 数据预览」，下面才是数据的四个来源。
     这两者不是并列关系，平铺成一排会让人以为 bots 和试玩是同一层的东西。 */
  #tabs { display: flex; gap: 10px; flex-wrap: wrap; padding: 0 28px 12px; }
  #tabs button { background: transparent; color: var(--dim); border: none;
                 border-bottom: 2px solid transparent; padding: 8px 4px;
                 cursor: pointer; font-size: 15px; font-weight: 600; }
  #tabs button:hover { color: var(--fg); }
  #tabs button.on { color: var(--fg); border-bottom-color: var(--accent); }

  #subtabs { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 28px 14px;
             border-bottom: 1px solid var(--line); }
  #subtabs.hide { display: none; }
  #subtabs button { background: var(--panel); color: var(--dim); border: 1px solid var(--line);
                    padding: 6px 13px; border-radius: 999px; cursor: pointer; font-size: 13px; }
  #subtabs button:hover { color: var(--fg); border-color: var(--accent); }
  #subtabs button.on { background: var(--accent); color: #0f1115;
                       border-color: var(--accent); font-weight: 600; }
  #subtabs .sep { width: 1px; background: var(--line); margin: 4px 6px; }
  /* 试玩那一页没有二级标签，但顶部仍要有分隔线 */
  #tabs.solo { border-bottom: 1px solid var(--line); padding-bottom: 12px; }

  #controls { position: sticky; top: 0; z-index: 10; display: flex; align-items: center;
              gap: 18px; flex-wrap: wrap; padding: 12px 28px;
              background: rgba(15,17,21,.96); border-bottom: 1px solid var(--line);
              backdrop-filter: blur(6px); }
  #controls button, .btn {
    background: var(--panel); color: var(--fg); border: 1px solid var(--line);
    padding: 6px 14px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #controls button:hover, .btn:hover { border-color: var(--accent); }
  label { color: var(--dim); font-size: 13px; display: flex; align-items: center; gap: 8px; }
  input[type=range] { width: 150px; accent-color: var(--accent); }
  .val { color: var(--fg); font-variant-numeric: tabular-nums; min-width: 46px; }

  main { padding: 22px 28px 60px; }
  h2 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
  h2 .tag { color: var(--dim); font-weight: 400; font-size: 12px; margin-left: 8px;
            font-family: ui-monospace, Menlo, monospace; }
  h3 { margin: 26px 0 4px; font-size: 14px; font-weight: 600; color: var(--fg); }
  .note { color: var(--dim); margin: 0 0 20px; font-size: 13px; max-width: 900px; }
  .vidbox { border-bottom: 1px solid var(--line); padding-bottom: 6px; }

  .clip { display: flex; gap: 22px; align-items: flex-start; margin-bottom: 24px; flex-wrap: wrap; }
  .panel { display: flex; flex-direction: column; gap: 6px; }
  .cap { color: var(--dim); font-size: 12px; }
  .film { width: 256px; height: 256px; image-rendering: pixelated;
          border: 1px solid var(--line); border-radius: 4px;
          background-repeat: no-repeat; background-size: auto 256px; }
  .meta { font-size: 12px; color: var(--dim); min-width: 280px; }
  .meta b { color: var(--fg); font-weight: 600; }
  .meta .row { margin-bottom: 3px; }
  .acts { font-family: ui-monospace, Menlo, monospace; font-size: 11px;
          color: var(--dim); line-height: 1.9; margin-top: 8px;
          display: flex; flex-wrap: wrap; gap: 3px; }
  .acts span { background: #1e222b; padding: 1px 4px; border-radius: 3px; margin-right: 3px; }
  #g-recacts span { cursor: pointer; }
  #g-recacts span:hover { outline: 1px solid var(--accent); }
  .acts span.now { background: var(--accent); color: #0f1115; }
  .hint { color: var(--warn); font-size: 12px; margin-top: 8px; }

  /* --- 试玩 --- */
  #screen { width: 640px; height: 512px; image-rendering: pixelated; display: block;
            border: 1px solid var(--line); border-radius: 4px; background: #000; }
  .gamewrap { display: flex; gap: 24px; align-items: flex-start; flex-wrap: wrap; }
  /* 两栏都要钉死宽度：不钉的话栏内那两段说明文字会把栏撑到 900px 上下，
     两栏加起来超过容器就换行，右栏掉到画面底下去。 */
  .gamecol { flex: 0 0 640px; width: 640px; }
  .gamecol .note { max-width: 640px; }
  .stats { font-family: ui-monospace, Menlo, monospace; font-size: 12px;
           color: var(--dim); flex: 0 1 420px; max-width: 420px; }
  .stats .note { max-width: 420px; }
  .stats b { color: var(--fg); }
  .stats .big { font-size: 26px; color: var(--ok); font-weight: 600; }
  .rel { position: relative; width: 640px; max-width: 100%; }
  /* 操作按钮：键盘之外的第二条路。不支持的动作自动禁用并标灰。 */
  #g-pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px;
           width: 640px; margin-top: 10px; }
  .padbtn { background: var(--panel); color: var(--fg); border: 1px solid var(--line);
            padding: 9px 6px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  .padbtn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .padbtn:active:not(:disabled) { background: var(--accent); color: #0f1115; }
  .padbtn:disabled { opacity: .3; cursor: not-allowed; }
  .padbtn[data-act="ATTACK"] { grid-column: span 2; }
  .modelbar { border: 1px solid var(--line); border-radius: 6px;
              padding: 12px 14px; margin-bottom: 14px; background: #13161c; }
  .bar { height: 6px; background: #1e222b; border-radius: 3px; overflow: hidden; }
  .bar .fill { height: 100%; width: 0%; background: var(--accent); transition: width .2s; }
  #g-running { margin-top: 10px; padding: 8px 12px; border-radius: 5px;
               background: #1a2030; border-left: 3px solid var(--ok);
               font-size: 13px; color: var(--dim); }
  #g-running b { color: var(--ok); font-size: 15px; }
  #g-running.stale { border-left-color: var(--warn); }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size: 12px;
          color: var(--dim); }
  .bad { color: #f7768e; }
  /* ===== 窄屏适配。必须放在最后：同优先级下后写的规则赢，
     以前放在前面被 #g-pad { width: 640px } 直接盖掉。 ===== */
  @media (max-width: 1000px) {
    .gamecol, #g-pad, .rel, #screen { width: 100%; max-width: 640px; }
    .gamecol { flex: 1 1 100%; }
    #screen { height: auto; aspect-ratio: 320 / 256; }
    .stats { flex: 1 1 100%; max-width: 100%; }
  }
  @media (max-width: 1000px) {
    .clip { flex-wrap: wrap; }
    .clip .panel, .clip img, .clip video { max-width: 100%; height: auto; }
    .meta { min-width: 0; }
    .vidbox video { width: 100% !important; max-width: 320px; }
  }
  @media (max-width: 560px) {
    #g-pad { grid-template-columns: repeat(2, 1fr); }
    .padbtn[data-act="ATTACK"] { grid-column: span 2; }
    main, header, #tabs, #subtabs, #controls { padding-left: 12px; padding-right: 12px; }
  }
</style>
</head>
<body>
<header>
  <h1>nano_world_model — GameNGen 在线试玩 &amp; 数据预览</h1>
</header>

<div id="tabs"></div>
<div id="subtabs"></div>

<div id="controls">
  <button id="play">⏸ 暂停</button>
  <label>速度 <input type="range" id="fps" min="1" max="35" value="8"><span class="val" id="fpsv">8 fps</span></label>
  <label>帧 <input type="range" id="frame" min="0" max="16" value="0"><span class="val" id="framev">0 / 16</span></label>
  <span class="sub" style="margin-left:auto">拖「帧」可逐帧对比</span>
</div>

<main id="main">
  <section id="game" style="display:none">
    <h2>在线试玩：GameNGen 复现模型<span class="tag" id="g-gpu">…</span></h2>
    <div class="gamewrap">
      <div class="gamecol">
        <div class="modelbar">
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <label style="white-space:nowrap">模型</label>
            <select class="btn" id="g-model" style="flex:1;min-width:240px"></select>
          </div>
          <p class="note" id="g-modelnote" style="margin:6px 0 0;font-size:12px"></p>
          <div id="g-progwrap" style="display:none;margin-top:8px">
            <div class="bar"><div class="fill" id="g-progfill"></div></div>
            <div class="mono" id="g-progtext" style="margin-top:4px"></div>
          </div>
          <div id="g-running">当前正在玩：<b id="g-runname">—</b></div>
        </div>

        <div class="rel">
          <canvas id="screen" width="320" height="256"></canvas>
        </div>
        <div id="g-pad">
          <button class="padbtn" data-act="TLEFT">↺ 左转</button>
          <button class="padbtn" data-act="FWD">↑ 前进</button>
          <button class="padbtn" data-act="TRIGHT">↻ 右转</button>
          <button class="padbtn" data-act="MLEFT">← 左移</button>
          <button class="padbtn" data-act="BACK">↓ 后退</button>
          <button class="padbtn" data-act="MRIGHT">→ 右移</button>
          <button class="padbtn" data-act="ATTACK">● 开火</button>
          <button class="padbtn" data-act="">□ 不动</button>
        </div>
        <div id="g-recbar" style="margin-top:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center">
          <button class="btn" id="g-replay">▶ 回放本局</button>
          <label>帧 <input type="range" id="g-scrub" min="0" max="0" value="0" style="width:260px">
            <span class="val" id="g-scrubv">0 / 0</span></label>
          <span class="mono" id="g-recact"></span>
        </div>
        <div class="acts" id="g-recacts" style="margin-top:6px;max-height:66px;overflow-y:auto"></div>
        <div style="margin-top:10px">
          <button class="btn" id="g-new">↻ 新开一局</button>
        </div>
      </div>

      <div class="stats">
        <div class="big" id="g-fps">— fps</div>
        <div class="row">每帧 <b id="g-ms">—</b> ms &nbsp;·&nbsp; 已生成 <b id="g-steps">0</b> 帧</div>
        <div class="row">当前动作 <b id="g-act">—</b></div>
        <div class="row" id="g-bench" style="margin-top:8px"></div>
        <div class="row bad" id="g-err"></div>

        <div class="row" style="margin-top:8px">一次点击 = <b>4</b> 帧（对齐训练数据的 4 帧一组）</div>
        <div class="row" id="g-missing"></div>
      </div>
    </div>
  </section>
</main>

<script>
const RES = 128, SCALE = 2;
let T = 17, frame = 0, playing = true, fps = 8, last = 0;
let sections = [], active = 0, lastData = 1;   // lastData: 数据预览里上次看的来源

function panel(cap, src) {
  const d = document.createElement('div');
  d.className = 'panel';
  d.innerHTML = `<div class="cap">${cap}</div>`;
  const f = document.createElement('div');
  f.className = 'film';
  f.style.backgroundImage = `url("${src}")`;
  d.appendChild(f);
  return [d, f];
}

/* ==================== 试玩 ==================== */
// 推理服务固定在同主机 :25677。要换成别的机器（比如 1202b 的 A6000）不在这儿改，
// 而是用 run_remote.sh 建 SSH 隧道把那台机器映射到本机这个端口——页面无需知情。
// 所有请求都带超时。没有超时的话，隧道抖一下就永远挂在 await 上，
// G.stepping 再也不释放，表现是「按键突然全没反应」，只能刷新。
async function api(path, opts, ms) {
  const ac = new AbortController();
  const t = setTimeout(() => ac.abort(), ms || 20000);
  try { return await fetch(path, {...(opts || {}), signal: ac.signal}); }
  finally { clearTimeout(t); }
}

const GAME_API = `http://${location.hostname}:25677`;
const G = {
  sid: null, stepping: false, steps: 0,
  times: [],
  loaded: null,      // 显存里真正装着的模型 id
  pool: [],          // 常驻在显存里的模型 —— 在池子里的切换是瞬时的
  hasNoop: false, hasBack: false,   // 当前模型支持哪些动作
  heldButtons: null, repeatLeft: 0,   // 当前这组动作还要再发几帧
  padQueue: [],      // 排队的点击，每项是一组按钮名；每项出 REPEAT 帧
  // 本局回放：每帧存下画面和当时的动作。上限 600 帧（约 2 分钟），
  // 超了就丢最老的——一帧 PNG 约 100KB，不设上限会把浏览器内存吃光。
  rec: [], recMax: 600, dropped: 0,   // dropped: 因超上限被丢掉的帧数
  scrubbing: false, replaying: false, timer: null,
  newing: null, newClearRec: false, newGen: 0,   // 飞行中的开局：promise、是否清录制、代次
  stale: true,       // 下拉框选的和 loaded 不一致 —— 此时禁止游玩。
                     // 初值必须是 true：还没问到服务端装的是哪个模型之前不许玩
};

const REPEAT = 4;   // 一次点击连发几帧，对齐训练数据的 4 帧一组

// ---- 本局回放 ----
function updateRecUI() {
  const n = G.rec.length;
  $('g-scrub').max = Math.max(0, n - 1);
  $('g-replay').disabled = n === 0;
  // 只在既没回放、玩家也没在手动查看某一帧时，才把游标顶到末尾。
  // 否则边玩边拖进度条，滑块每帧都被拽回去，根本拖不动。
  if (!G.replaying && !G.scrubbing) {
    $('g-scrub').value = Math.max(0, n - 1);
    // 缓冲满了就说清楚是「最近 N 帧 / 共走了 M 帧」，别一直显示 600/600 骗人
    $('g-scrubv').textContent = n ? `${n} / ${n}` : '0 / 0';
    $('g-recact').textContent = !n ? '还没有帧'
      : (G.dropped ? `最近 ${n} 帧（共走了 ${n + G.dropped} 帧）` : `已记录 ${n} 帧`);
  }
  // 动作历史：和数据预览那边同一套样式，最近 120 帧
  const from = Math.max(0, n - 120);
  $('g-recacts').innerHTML = G.rec.slice(from).map((r, k) =>
    `<span data-i="${from + k}">${r.action}</span>`).join('');
  const box = $('g-recacts');
  if (!G.replaying) box.scrollTop = box.scrollHeight;
}

function showRecFrame(i) {
  const r = G.rec[i];
  if (!r) return;
  drawFrame(r.frame);
  $('g-scrub').value = i;
  $('g-scrubv').textContent = `${i + 1} / ${G.rec.length}`;
  for (const el of $('g-recacts').children) {
    const on = +el.dataset.i === i;
    el.className = on ? 'now' : '';
    // 只滚历史条自己。scrollIntoView 会连带滚动 document，
    // 回放时每帧滚一次，整页被死死按住，用户拉都拉不回来。
    if (on) {
      const box = el.parentElement;
      if (el.offsetLeft < box.scrollLeft) box.scrollLeft = el.offsetLeft;
      else if (el.offsetLeft + el.offsetWidth > box.scrollLeft + box.clientWidth)
        box.scrollLeft = el.offsetLeft + el.offsetWidth - box.clientWidth;
    }
  }
  $('g-recact').textContent = `动作 ${r.action} · ${r.ms} ms`;
}

function startReplay() {
  if (!G.rec.length) return;
  resetInput();          // 回放期间攒下的转向/开火不该在结束后突然打出来
  // 回放期间禁止再生成新帧，否则实时画面会和回放抢同一块 canvas
  G.replaying = true;
  syncPadEnabled();
  $('g-replay').textContent = '⏹ 停止回放';
  let i = 0;
  G.replayTimer = setInterval(() => {
    if (i >= G.rec.length) { stopReplay(); return; }
    showRecFrame(i++);
  }, 1000 / 8);          // 固定 8 fps 回放，和数据页那边一致
}

function stopReplay() {
  const was = G.replaying;
  if (G.replayTimer) clearInterval(G.replayTimer);
  G.replayTimer = null;
  G.replaying = false;
  // 只有真在回放时才清输入（清的是回放期间攒下的点击）。无条件清的话，
  // gameNew 顺手调一次 stopReplay 就会把「触发这一轮的那次点击」也抹掉。
  if (was) resetInput();
  syncPadEnabled();
  const b = $('g-replay');
  if (b) b.textContent = '▶ 回放本局';
  if (b) updateRecUI();          // 否则计数停在「37 / 600」直到下一帧生成
}

// 报的是按钮名，翻成动作 id 是服务端的事——两家模型的表不一样，
// 前端写死 id 会让动作含义整体错位。空数组 = 「不动」。
function pickButtons() {
  if (G.padQueue.length) return G.padQueue.shift();
  return [];
}

const $ = id => document.getElementById(id);

// 当前模型没有这个动作时的提示。同一个键连按不重复刷，2 秒后自己消失。
let _errTimer = null;
function showErr(msg) {
  $('g-err').innerHTML = `<span class="bad">${msg}</span>`;
  clearTimeout(_errTimer);
  _errTimer = setTimeout(clearErr, 6000);   // 别让一次抖动的提示永久挂着
}
function clearErr() { clearTimeout(_errTimer); $('g-err').textContent = ''; }

function drawFrame(dataUrl) {
  const img = new Image();
  img.onload = () => $('screen').getContext('2d').drawImage(img, 0, 0);
  img.src = dataUrl;
}

// keepInput：从 gameLoop 里补开 session 时必须传 true。
// 不传的话 resetInput() 会把「触发这一轮循环的那次点击」一起清掉，
// 于是 session 失效后的第一次点击被静默吃掉（实测点左转出 0 帧）。
async function gameNew(keepRec, keepInput) {
  // 同一时刻只开一局。gameLoop 发现没 session 会来补开，probeServer 换完模型也会开，
  // 两边撞上就是两个 /new、两个 session，后到的把先到的覆盖。
  // 撞上飞行中的那一局就合并，绝不串到它后面。串行会出这种事：
  // 排在后面的 gameNew 落地时，把这期间点出来的帧和排队的点击一起抹掉
  // ——实测「连点两下新开一局再点前进」，前 8 帧凭空消失。
  if (G.newing) {
    if (!keepRec) G.newClearRec = true;     // 有人要求清录制，就让飞行中那局去清
    return G.newing;
  }
  G.newClearRec = !keepRec;
  const gen = ++G.newGen;   // 代次号：只有最新这一局的落地才准动录制和画面
  // 旧局立刻作废。不作废的话，/new 还没回来时点的那几帧会发到旧 session 上，
  // 然后被下面那句 G.rec = [] 抹掉——「点了新开一局马上点前进，前几帧丢了」。
  G.sid = null;
  if (!keepInput) resetInput();
  stopReplay();
  $('g-err').textContent = '';
  G.newing = (async () => {
    try {
      const r = await api(GAME_API + '/new', {method: 'POST', body: JSON.stringify({})});
      const d = await r.json();
      // 已经被更新的一局取代了就什么都别做。否则旧局落地会把新局刚记下的帧抹掉
      // ——实测连点三次「新开一局」再点开火，4 帧只剩 2 帧。
      if (gen !== G.newGen) return;
      G.sid = d.id; G.steps = 0; G.times = [];
      if (G.newClearRec) { G.rec = []; G.dropped = 0; }   // 重连不该抹掉玩家的录制
      updateRecUI();
      drawFrame(d.frame);
      $('g-steps').textContent = '0';
      $('g-fps').textContent = '— fps';
    } catch (e) {
      $('g-err').innerHTML = `<span class="bad">连不上推理服务 ${GAME_API}。`
        + `请确认 gamengen/doom_ngen_server.py 在跑。</span>`;
    } finally {
      if (gen === G.newGen) G.newing = null;
    }
  })();
  return G.newing;
}

// 有没有待处理的输入。没有就一帧都不生成——世界冻住。
// 没有待发的帧就一帧都不生成——世界冻住。模型是随机的，同样的上下文
// 喂「不动」也会画出不同的下一帧，所以「一直循环」等于「你不点它也自己漂」
// （实测连发 30 次 NOOP，第 30 帧与第 0 帧平均差 11.66/255，墙的贴图都换了）。
function hasInput() {
  // repeatLeft 必须算进来。不算的话，一次点击走完第 1 帧后队列已空，
  // 循环就此停住，剩下 3 帧「上膛」留在 heldButtons 里，等下一次点击时先把
  // 上一个动作打完——实测点「左转」发出去的是「前进 前进 前进 左转」。
  if (G.repeatLeft > 0 && G.heldButtons) return true;
  return G.padQueue.length > 0;
}

// 输入状态只有这一个清空口。以前散落在各个分支里，
// 漏一处就会把上一次的动作带进下一次（或让世界自己一直走）。
function resetInput() {
  G.padQueue = [];
  G.repeatLeft = 0; G.heldButtons = null;
  clearTimeout(G.timer); G.timer = null;      // 排着的下一轮也得撤，否则还会再走一帧
}

// 全页只允许有一条循环链。以前每次输入都直接调 gameLoop()，而循环自己又在
// finally 里再排一条 —— 链会越积越多，实际帧率变成链数的倍数。
function schedule(ms) {
  clearTimeout(G.timer);
  G.timer = setTimeout(() => { G.timer = null; gameLoop(); }, ms || 0);
}
// 外部输入触发。正在跑的那一轮结束后会自己续，这里再排一条就是多的。
function kick() { if (!G.stepping && !G.timer) schedule(0); }

async function gameLoop() {
  if (G.stepping || G.stale || G.replaying) return;
  if (!hasInput()) return;                 // 松手就停在这里
  // stepping 这个标志位必须由 finally 统一释放。以前在每条 return 分支里手动清，
  // 漏掉一条就永久卡死——表现正是「按键大部分时候没反应，偶尔有反应」。
  G.stepping = true;
  G.scrubbing = false;      // 又开始玩了，进度条回到跟随最新帧
  let again = false;
  try {
    if (!G.sid) { await gameNew(true, true); if (!G.sid) return; }
    // 训练数据里按键连着 4 帧不变（采数据的 PPO 每 4 帧才改一次按键，实测
    // 1106 段里 972 段恰好长 4）。这里也把一次按键连发 REPEAT 帧，中途不重读输入。
    if (G.repeatLeft > 0 && G.heldButtons) {
      G.repeatLeft--;
    } else {
      G.heldButtons = pickButtons();
      G.repeatLeft = REPEAT - 1;
    }
    const buttons = G.heldButtons;
    const t0 = performance.now();
    const r = await api(GAME_API + '/step', {
      method: 'POST', body: JSON.stringify({id: G.sid, buttons})});

    if (r.status === 410) {                // session 失效，或模型被换掉
      const d0 = await r.json().catch(() => null);
      // 换了模型，历史就不再是同一个世界的了，这一种要清；纯 session 过期则留着。
      // 不能只看 reason：换模型时服务端会把 session 一并清掉，前端收到的是
      // 「session expired」，所以还要拿 410 里带回的当前模型 id 比一比。
      const modelChanged = d0 && (d0.reason === 'model'
                                  || (d0.model && d0.model !== G.loaded));
      if (modelChanged) probeServer();   // 界面上的模型名也得跟着换
      G.sid = null;
      G.repeatLeft = 0; G.heldButtons = null;
      await gameNew(!modelChanged, true);
      return;
    }
    if (r.status === 422) {                // 当前模型没有这组按键
      $('g-act').textContent = '该模型无此动作';
      G.repeatLeft = 0; G.heldButtons = null;
      return;
    }
    if (!r.ok) {
      // 服务端一时不可用（500/503/409）。清掉这一拍的输入避免堆积，
      // 但保留自愈：下一次按键还能继续玩，不必刷新页面。
      showErr(`服务端 ${r.status}，稍后再试`);
      G.repeatLeft = 0; G.heldButtons = null;
      return;
    }

    const d = await r.json();
    clearErr();
    if (G.replaying) return;    // 回放期间飞回来的帧不许盖掉回放画面                 // 一次成功就把上一次的错误提示撤掉
    drawFrame(d.frame);
    G.rec.push({frame: d.frame, action: d.action, ms: d.ms});
    if (G.rec.length > G.recMax) { G.rec.shift(); G.dropped++; }
    updateRecUI();
    G.steps = d.steps;
    const wall = performance.now() - t0;
    // d.steps 是服务端自增后的值，第一帧就是 1
    if (d.steps > 1) { G.times.push(wall); if (G.times.length > 15) G.times.shift(); }
    const mean = G.times.length ? G.times.reduce((a, b) => a + b, 0) / G.times.length : wall;
    $('g-ms').textContent = d.ms.toFixed(0);
    $('g-steps').textContent = d.steps;
    $('g-act').textContent = d.action;
    // 这里报的是模型本身的速率，不含慢放的等待。慢放只是播放节流，不改推理快慢。
    $('g-fps').textContent = (1000 / mean).toFixed(2) + ' fps';
    again = true;
  } catch (e) {
    showErr('推理请求失败，按键可重试');
    G.repeatLeft = 0; G.heldButtons = null;
  } finally {
    G.stepping = false;                    // 无论走哪条路都要放开
    if (again) schedule(0);
  }
}

// 输入只有一条路：点操作按钮。键盘和鼠标转向已整个去掉——
// 「按一下键」和「点一下按钮」给出的帧数不一样（1 帧 vs 4 帧），
// 两套语义并存只会让人搞不清自己到底发了什么。
function initGame() {
  document.addEventListener('visibilitychange', () => { if (document.hidden) resetInput(); });
  $('g-replay').onclick = () => G.replaying ? stopReplay() : startReplay();
  $('g-scrub').oninput = e => { G.scrubbing = true; stopReplay(); showRecFrame(+e.target.value); };
  $('g-recacts').onclick = e => {
    const i = e.target.dataset && e.target.dataset.i;
    if (i !== undefined) { stopReplay(); G.scrubbing = true; showRecFrame(+i); }
  };
  // 按钮点一下就发一组动作，和键盘走同一条路径（同样重复 REPEAT 帧）
  for (const b of document.querySelectorAll('.padbtn')) {
    b.onclick = () => {
      if (G.stale || G.replaying) return;     // 换模型中／回放中不接受输入
      // 点完就丢掉焦点：按钮保留焦点的话，之后敲空格或回车会把它再激活一次，
      // 等于键盘又能玩了 —— 而键盘是明确要去掉的。
      b.blur();
      // 队列而不是单槽：单槽时，前一次点击还没被 pickButtons 取走
      // （比如正在等 /new 回来）就会被后一次覆盖，前一次凭空消失。
      G.padQueue.push(b.dataset.act ? [b.dataset.act] : []);
      kick();
    };
  }
  $('g-new').onclick = () => gameNew();
  // 三个模型都常驻显存，切换只是改个指针（实测 50–93ms），
  // 所以下拉框选了就直接切，不再多一步「载入」按钮。
  $('g-model').onchange = () => { showModelNote(); switchModel(); };

  probeServer();
}

let MODELS = [];

function fillModels(list, loaded) {
  const sel = document.getElementById('g-model');
  MODELS = list || [];
  sel.innerHTML = MODELS.map(m =>
    `<option value="${m.id}"${m.id === loaded ? ' selected' : ''}>${m.name}</option>`).join('');
  showModelNote();
}

// 下拉框选的 ≠ 显存里装的，就把游玩彻底掐掉。
// 不掐的话会出现「界面写着 A、实际在跑 B」——玩家看到的画面和他以为的模型对不上，
// 比慢、比丑都严重，因为它让人得出错误结论。
// 遮罩显不显示只由这里决定。以前 padbtn 和 pointerlockchange 各写各的，
// 结果用按钮玩过之后遮罩被写死成 none，切模型的警告就再也看不见了。
// 不能用的时候就让按钮看起来不能用。静默吞掉点击最招人烦。
function syncPadEnabled() {
  for (const b of document.querySelectorAll('.padbtn')) {
    const a = b.dataset.act;
    const noAct = (a === 'BACK' && !G.hasBack) || (a === '' && !G.hasNoop);
    b.disabled = noAct || G.stale || G.replaying;
    b.title = noAct ? '当前模型没有这个动作'
            : G.stale ? '模型切换中' : G.replaying ? '回放中' : '';
  }
}

// 下拉框选的和显存里跑的不一致 = stale。这段时间一帧都不许发：
// 否则会出现「界面写着 A、实际在跑 B」——玩家据此得出的结论全是错的。
// 常驻之后这个窗口只有几十毫秒，但换模型失败、后端连不上时它会持续，
// 所以这条防线不能撤。
function syncModelState() {
  const sel = document.getElementById('g-model');
  G.stale = sel.value !== G.loaded;
  syncPadEnabled();
  const run = document.getElementById('g-running');
  run.className = G.stale ? 'stale' : '';
  if (G.stale) {
    const want = (MODELS.find(m => m.id === sel.value) || {}).name || sel.value;
    run.firstChild.textContent = '切换中：';
    document.getElementById('g-runname').textContent = want;
  } else {
    run.firstChild.textContent = '当前正在玩：';
    document.getElementById('g-runname').textContent = G.loadedName || '—';
  }
}

function showModelNote() {
  const id = document.getElementById('g-model').value;
  const m = MODELS.find(x => x.id === id);
  document.getElementById('g-modelnote').innerHTML = m
    ? `${m.note} <a href="${m.github}" target="_blank" style="color:var(--accent)">代码仓库</a>`
      + ` · <a href="${m.repo}" target="_blank" style="color:var(--accent)">权重</a>` : '';
}

async function switchModel() {
  const $ = id => document.getElementById(id);
  const id = $('g-model').value;
  if (id === G.loaded) { syncModelState(); return; }
  G.sid = null;
  syncModelState();               // 立刻进入 stale：按钮置灰、读数写「切换中」
  $('g-model').disabled = true;   // 切换途中不许再改选，否则装完对不上号
  $('g-err').textContent = '';
  // 常驻的模型几十毫秒就切完，进度条只会闪一下；只在真要载权重时才显示
  const resident = G.pool.includes(id);
  if (!resident) $('g-progwrap').style.display = '';
  // 真进度：/status 不排队进 GPU 线程，所以 GPU 忙着时也读得到当前阶段。
  const t0 = performance.now();
  const poll = setInterval(async () => {
    try {
      const p = await (await api(GAME_API + '/status', null, 5000)).json();
      const pct = p.total ? Math.round(100 * p.done / p.total) : 8;
      $('g-progfill').style.width = pct + '%';
      $('g-progtext').textContent =
        `${p.phase || '准备中'}${p.total ? ` ${p.done}/${p.total}` : ''}`
        + ` · ${((performance.now() - t0) / 1000).toFixed(1)}s`;
    } catch (e) { /* 载入期间偶发连不上，忽略 */ }
  }, 250);
  try {
    const r = await api(GAME_API + '/load', {method: 'POST', body: JSON.stringify({id})}, 600000);
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    $('g-progfill').style.width = '100%';
    probeServer();
  } catch (e) {
    // 切换失败：把下拉框退回到真正在跑的那个，界面和显存必须一致
    $('g-err').innerHTML = `<span class="bad">切换失败：${e.message}，已退回</span>`;
    if (G.loaded) $('g-model').value = G.loaded;
    showModelNote();
  } finally {
    clearInterval(poll);
    setTimeout(() => { $('g-progwrap').style.display = 'none';
                       $('g-progfill').style.width = '0%'; }, 600);
    $('g-model').disabled = false;
    syncModelState();
  }
}

function probeServer() {
  const $ = id => document.getElementById(id);
  probeServer._tries = (probeServer._tries || 0) + 1;
  api(GAME_API + '/info', null, 8000).then(r => r.json()).then(d => {
    // 服务端还在载模型：这份 /info 没有 gpu/steps/buffer，别拿它去填界面，
    // 否则会写出 "undefined 步去噪" 并把按键表全标成「该模型没有」，且再也不刷新。
    if (d.loading || !d.loaded) {
      fillModels(d.models, null);
      $('g-gpu').textContent = '推理服务正在载入模型…';
      $('g-err').textContent = '';
      return setTimeout(probeServer, 2000);
    }
    probeServer._tries = 0;
    fillModels(d.models, d.loaded);
    // 动作表随模型变：a16z 那 18 个动作里没有 BACK 也没有 NOOP
    G.hasNoop = !!d.has_noop;
    G.hasBack = (d.actions || []).some(a => a.split('+').includes('BACK'));
    const missing = [];
    if (!G.hasBack) missing.push('后退');
    if (!G.hasNoop) missing.push('不动');
    $('g-missing').textContent = missing.length
      ? `该模型没有：${missing.join('、')}（按钮已置灰）` : '';
    G.loaded = d.loaded;
    G.pool = d.pool || [];
    G.loadedName = (MODELS.find(m => m.id === d.loaded) || {}).name || d.loaded;
    $('g-gpu').textContent =
      `${d.gpu} · ${d.steps} 步去噪 · ${d.res} · 上下文 ${d.buffer} 帧`
      + (G.pool.length > 1 ? ` · ${G.pool.length} 个模型常驻显存` : '');
    // syncModelState 会解除 stale（放开游玩），所以必须等新 session 建好之后再调。
    // 早调的话中间有一小段「按钮可点、但 G.sid 还是 null」的窗口。
    if (d.bench) {
      $('g-bench').innerHTML =
        `启动基准（${d.bench.n} 帧连续前进）：<b>${d.bench.mean_ms} ms/帧</b> = `
        + `<b>${d.bench.fps} fps</b>，抖动 ${d.bench.min_ms}–${d.bench.max_ms} ms`;
    }
    return gameNew().then(syncModelState);
  }).catch(() => {
    // 连不上就必须掐掉游玩。以前这条分支只改了两行文字，G.stale 还停在
    // false，于是页面写着「推理服务未启动」却照样能点出帧来。
    G.loaded = null; G.pool = [];
    syncModelState();
    $('g-gpu').textContent = '推理服务未启动';
    $('g-err').innerHTML = `<span class="bad">连不上 ${GAME_API}，重试中…</span>`;
    // 一次连不上就永久放弃的话，服务晚起来几秒页面就废了，只能刷新。
    // 退避重试，最多约 1 分钟。
    if (probeServer._tries < 12) setTimeout(probeServer, 5000);
  });
}

/* ==================== 数据预览 ==================== */
// 两个 json 都要兜底：试玩不依赖它们，不该被一个静态文件拖死。
Promise.all([
  fetch('outputs/manifest.json').then(r => r.json()).catch(() => []),
  fetch('outputs/videos.json').then(r => r.json()).catch(() => ({})),
]).then(([groups, vids]) => {
  const main = document.getElementById('main');
  const tabs = document.getElementById('tabs');

  const subtabs = document.getElementById('subtabs');

  // 一级：试玩 / 数据预览
  const playBtn = document.createElement('button');
  playBtn.textContent = '🎮 在线试玩';
  playBtn.onclick = () => show(0);
  const dataBtn = document.createElement('button');
  dataBtn.textContent = '📊 数据预览';
  dataBtn.onclick = () => show(Math.min(lastData, sections.length - 1));  // 回到上次看的来源
  tabs.append(playBtn, dataBtn);
  // manifest 没生成或拿不到时，别摆一个点了会炸的空页签。
  if (!groups.length) { dataBtn.disabled = true; dataBtn.title = '还没生成数据预览'; dataBtn.style.opacity = '.4'; }
  sections.push({sec: $('game'), btn: playBtn, films: [], actEls: [], isGame: true});

  // 二级：数据的四个来源
  groups.forEach((g, gi) => {
    if (gi === 1) {
      const sep = document.createElement('div'); sep.className = 'sep'; subtabs.appendChild(sep);
    }
    const btn = document.createElement('button');
    btn.textContent = g.title.replace(/^(下载|本地录制)：/, '');
    btn.title = g.id;
    const myIndex = sections.length;
    btn.onclick = () => show(myIndex);
    subtabs.appendChild(btn);

    const sec = document.createElement('section');
    sec.style.display = 'none';
    sec.innerHTML = `<h2>${g.title}<span class="tag">${g.id}</span></h2>
                     <p class="note">${g.note}</p>`;

    const v = vids[g.id.replace(/^rec_/, '')];
    const vbox = document.createElement('div');
    vbox.className = 'vidbox';
    if (v) {
      vbox.innerHTML = `
        <h3>录像本身</h3>
        <p class="note">整集 <b>${v.episode_frames}</b> 帧 / ${v.episode_seconds} 秒，
           这里放开头 <b>${v.seconds}</b> 秒。开头两秒的白雾是 9 个角色挤在同一出生点。</p>
        <div class="clip">
          <div class="panel"><div class="cap">录制器存下的原生画面 ${v.raw_res}</div>
            <video src="${v.raw}" controls loop muted playsinline
                   style="width:320px;border:1px solid var(--line);border-radius:4px"></video></div>
          <div class="panel"><div class="cap">缩到模型实际看到的 ${v.model_res}</div>
            <video src="${v.model}" controls loop muted playsinline
                   style="width:256px;image-rendering:pixelated;border:1px solid var(--line);border-radius:4px"></video></div>
        </div>`;
    } else {
      vbox.innerHTML = `
        <h3>录像本身</h3>
        <p class="note">无连续录像。存的是抽样过的 10 帧滑窗，展开后 shard_0 实测
           <b>152</b> 段碎片，中位 <b>23</b> 帧、最长 <b>59</b> 帧；≥17 帧的 99 段，≥129 帧的 <b>0</b> 段。</p>`;
    }
    sec.appendChild(vbox);

    const h = document.createElement('h3');
    h.textContent = '训练切片：原始 vs 编解码重建';
    const hn = document.createElement('p');
    hn.className = 'note';
    hn.textContent = '一段 = 17 帧 = 0.49 秒，模型一次吃这么多。';
    sec.append(h, hn);

    const films = [], actEls = [];
    for (const c of g.clips) {
      T = c.frames;
      const row = document.createElement('div');
      row.className = 'clip';
      const [p1, f1] = panel('原始', c.orig);
      const [p2, f2] = panel('encode → decode 重建', c.recon);
      films.push(f1, f2);

      const meta = document.createElement('div');
      meta.className = 'meta';
      const uniqPct = (100 * c.uniq_codes / c.n_codes).toFixed(0);
      meta.innerHTML = `
        <div class="row">PSNR <b>${c.psnr} dB</b> · 平均绝对误差 <b>${c.mae}</b>/255</div>
        <div class="row">编码后 <b>${c.n_codes}</b> 个整数，不重复的 <b>${c.uniq_codes}</b>（${uniqPct}%）</div>
        <div class="row">${c.frames} 帧 × ${c.res}px</div>`;
      const acts = document.createElement('div');
      acts.className = 'acts';
      acts.innerHTML = c.actions.map(a => `<span>${a}</span>`).join('');
      meta.appendChild(acts);
      actEls.push(acts);
      if (c.uniq_codes / c.n_codes < 0.5) {
        const hint = document.createElement('div');
        hint.className = 'hint';
        hint.textContent = '↑ 不重复的码不到一半（其余片段都在 1200 上下）';
        meta.appendChild(hint);
      }
      row.append(p1, p2, meta);
      sec.appendChild(row);
    }
    main.appendChild(sec);
    sections.push({ sec, btn, films, actEls });
  });

  const fslider = document.getElementById('frame');
  fslider.max = T - 1;

  function draw() {
    const s = sections[active];
    if (s.isGame) return;
    const off = -frame * RES * SCALE;
    for (const f of s.films) f.style.backgroundPosition = `${off}px 0`;
    for (const a of s.actEls) {
      const kids = a.children;
      for (let i = 0; i < kids.length; i++)
        kids[i].className = (i === frame) ? 'now' : '';
    }
    fslider.value = frame;
    document.getElementById('framev').textContent = `${frame} / ${T - 1}`;
  }

  function show(i) {
    const isGame = sections[i].isGame;
    sections.forEach((s, j) => {
      const on = (i === j);
      s.sec.style.display = on ? '' : 'none';
      if (j > 0) s.btn.className = on ? 'on' : '';   // 二级按钮
      // 切走的那页里的 <video> 带 loop，不暂停就一直在后台解码
      if (!on) for (const v of s.sec.querySelectorAll('video')) v.pause();
    });
    playBtn.className = isGame ? 'on' : '';
    dataBtn.className = isGame ? '' : 'on';
    subtabs.className = isGame ? 'hide' : '';
    tabs.className = isGame ? 'solo' : '';
    if (!isGame) lastData = i;
    active = i;
    // 逐帧播放那排控件对试玩没意义
    document.getElementById('controls').style.display = isGame ? 'none' : 'flex';
    if (!isGame) draw();
    window.scrollTo({ top: 0 });
  }

  function tick(ts) {
    if (playing && ts - last > 1000 / fps) { last = ts; frame = (frame + 1) % T; draw(); }
    requestAnimationFrame(tick);
  }
  initGame();
  show(0);
  requestAnimationFrame(tick);

  document.getElementById('play').onclick = e => {
    playing = !playing;
    e.target.textContent = playing ? '⏸ 暂停' : '▶ 播放';
  };
  document.getElementById('fps').oninput = e => {
    fps = +e.target.value;
    document.getElementById('fpsv').textContent = fps + ' fps';
  };
  fslider.oninput = e => {
    playing = false;
    document.getElementById('play').textContent = '▶ 播放';
    frame = +e.target.value; draw();
  };
  document.onkeydown = e => {
    if (sections[active] && sections[active].isGame) return;
    if (e.key === 'ArrowLeft')  { playing = false; frame = (frame - 1 + T) % T; draw(); }
    if (e.key === 'ArrowRight') { playing = false; frame = (frame + 1) % T; draw(); }
    if (e.key === 'ArrowLeft' || e.key === 'ArrowRight')
      document.getElementById('play').textContent = '▶ 播放';
  };
});
</script>
</body>
</html>
