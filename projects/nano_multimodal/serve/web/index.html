<!doctype html>
<meta charset="utf-8">
<title>nano_multimodal</title>
<!--
  index.html — the whole frontend, one self-contained file. No build step, no CDN:
  a teaching project must not ask a student to install a frontend toolchain before
  they can look at their own data.

  Two tabs (data / inference), three lines each, ONE set of components. The band
  colours are keyed off token TYPE ids, which are globally stable across the three
  lines (spec.py) even though token ids are per-line — so one legend is correct
  everywhere, and switching lines does not change the layout. That the same screen
  serves text, motion and video is not a saving; it is the argument.
-->
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --line:#252a34; --fg:#e6e9ef; --dim:#8b93a3;
    --text:#4c8dff; --motion:#37c07a; --control:#6b7280; --video:#a970ff; --action:#ff9f43;
    --sup:#ffd866;
  }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg);
         font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace }
  header { display:flex; gap:18px; align-items:center; padding:10px 16px;
           border-bottom:1px solid var(--line); position:sticky; top:0;
           background:var(--bg); z-index:5 }
  .tabs button, .lines button { background:none; border:1px solid var(--line);
           color:var(--dim); padding:4px 12px; cursor:pointer; border-radius:4px;
           font:inherit }
  .tabs button.on, .lines button.on { color:var(--fg); border-color:#4b566b;
           background:var(--panel) }
  .lines { margin-left:auto; display:flex; gap:6px; align-items:center }
  main { padding:14px 16px 60px; max-width:1500px }
  section { background:var(--panel); border:1px solid var(--line); border-radius:6px;
            padding:12px 14px; margin-bottom:14px }
  h2 { font-size:12px; letter-spacing:.08em; text-transform:uppercase;
       color:var(--dim); margin:0 0 10px; font-weight:600 }
  .sub { color:var(--dim); font-size:12px }
  canvas { display:block; image-rendering:pixelated }
  .row-list canvas { cursor:pointer; margin-bottom:2px }
  .legend { display:flex; gap:14px; flex-wrap:wrap; margin-top:8px; font-size:12px }
  .swatch { display:inline-block; width:10px; height:10px; border-radius:2px;
            margin-right:5px; vertical-align:-1px }
  .track { position:relative; margin:6px 0 }
  .track .lab { position:absolute; left:-2px; top:-14px; font-size:11px; color:var(--dim) }
  #player { display:flex; gap:16px; align-items:flex-start; flex-wrap:wrap }
  #stage { border:1px solid var(--line); border-radius:4px; background:#000 }
  .ctrls { display:flex; gap:8px; align-items:center; margin-top:8px }
  input[type=range] { width:240px }
  .tokinfo { font-size:12px; line-height:1.7 }
  .tokinfo b { color:var(--fg) } .tokinfo span { color:var(--dim) }
  .txt { line-height:2.1; word-break:break-word; font-size:14px }
  .txt i { font-style:normal; padding:1px 0; border-radius:2px; cursor:pointer }
  .txt i:nth-child(odd) { background:#ffffff10 }
  .txt i.sel { background:var(--sup); color:#111 }
  .ctrl-tok { color:var(--control); background:#ffffff08; padding:0 3px;
              border-radius:2px; font-size:11px }
  .bar { height:14px; border-radius:2px; display:inline-block }
  table { border-collapse:collapse; font-size:12px } td,th { padding:2px 10px 2px 0;
          text-align:left; vertical-align:top } th { color:var(--dim); font-weight:500 }
  .note { color:var(--dim); font-size:12px; margin-top:6px }
  .err { color:#ff7b72; white-space:pre-wrap; font-size:12px }
  button.act { background:var(--panel); border:1px solid var(--line); color:var(--fg);
               padding:5px 10px; border-radius:4px; cursor:pointer; font:inherit }
  button.act:hover { border-color:#4b566b }
  input[type=text] { background:#0b0d11; border:1px solid var(--line); color:var(--fg);
                     padding:6px 8px; border-radius:4px; font:inherit; width:420px }
  .keys { display:grid; grid-template-columns:repeat(3,42px); gap:4px }
  .keys button { padding:6px 0 }
  .hide { display:none }
  /* One cell = one token: the readable piece on top, the integer the model sees
     underneath. The pairing IS the screen, so they are laid out as one unit and
     never allowed to drift apart. */
  .cells { display:flex; flex-wrap:wrap; gap:1px 2px; align-items:flex-end;
           line-height:1.25; margin-bottom:14px }
  .cell { display:flex; flex-direction:column; align-items:center; cursor:pointer;
          border-radius:3px; padding:1px 2px }
  .cell:hover { background:#ffffff12 }
  .cell.sel { background:var(--sup) }
  .cell.on .n { color:var(--sup) }
  .cell.sel .w, .cell.sel .n { color:#111 !important }   /* selection outranks "supervised" */
  .more { font-size:11px; color:var(--dim); border:1px dashed var(--line);
          border-radius:3px; padding:2px 6px; cursor:pointer; align-self:flex-end }
  .more:hover { color:var(--fg); border-color:#4b566b }
  .cell .w { font-size:14px; white-space:pre }
  .cell .n { font-size:10px; color:#6b7280 }
  .cell.ctl .w { color:var(--control); font-size:11px }
  .gname { align-self:flex-end; font-size:11px; color:var(--dim); padding:0 4px 1px 0 }
  .media-row { display:flex; gap:14px; flex-wrap:wrap; margin:10px 0 4px }
  .media-card { border:1px solid var(--line); border-radius:5px; padding:8px }
  .media-card .cap { font-size:11px; color:var(--dim); margin-bottom:6px }
  select { background:#0b0d11; border:1px solid var(--line); color:var(--fg);
           padding:5px 8px; border-radius:4px; font:inherit; max-width:640px }
</style>

<header>
  <b>nano_multimodal</b>
  <div class="tabs">
    <button id="tab-data" class="on">数据</button>
    <button id="tab-play">推理</button>
  </div>
  <div class="lines">
    <span class="sub">线:</span>
    <button data-line="text">文本</button>
    <button data-line="motion">动作</button>
    <button data-line="video" class="on">视频</button>
  </div>
</header>

<main>
  <!-- ============================ 数据 ============================ -->
  <div id="pane-data">
    <section>
      <h2>词表 <span class="sub">— 这个模型认识的整数,分成几段</span></h2>
      <div id="vocab"></div>
      <div class="note" id="vocab-note"></div>
    </section>

    <section>
      <h2>一行训练数据
        <span class="sub">— 上面是人看的,下面是模型看的整数</span>
      </h2>
      <div class="ctrls" style="margin:0 0 12px">
        <span class="sub">选一行:</span>
        <select id="row-pick"></select>
        <span class="sub" id="row-label"></span>
      </div>
      <div id="media"></div>
      <div id="cells" class="cells"></div>
      <div class="tokinfo" id="tokinfo"></div>
      <div class="note" id="notes"></div>
    </section>

    <section>
      <h2>统计</h2>
      <div id="stats"></div>
    </section>
  </div>

  <!-- ============================ 推理 ============================ -->
  <div id="pane-play" class="hide">
    <section>
      <h2>用哪个 checkpoint
        <span class="sub">— 同一条线上的不同时刻。挑「谷底」和「末尾」各生成一次,过拟合是看得见的</span>
      </h2>
      <select id="ckpt-pick" style="max-width:640px"></select>
      <span class="sub" id="ckpt-note"></span>
    </section>

    <section id="play-text" class="hide">
      <h2>文本续写</h2>
      <input type="text" id="p-text" value="The city of">
      <button class="act" id="go-text">生成</button>
      <span class="sub" id="text-status"></span>
      <div class="txt" id="out-text" style="margin-top:10px"></div>
    </section>

    <section id="play-motion" class="hide">
      <h2>文本 → 动作</h2>
      <div id="prompt-list" style="margin-bottom:8px"></div>
      <input type="text" id="p-motion" value="a person walks forward and then turns around.">
      <button class="act" id="go-motion">生成</button>
      <span class="sub" id="motion-status"></span>
      <div id="motion-out" style="margin-top:10px"></div>
    </section>

    <section id="play-video" class="hide">
      <h2>视频世界模型 <span class="sub">— 一帧约 250 ms。这是 AR 的真实速度(一个 token 一次前向),不是掉帧</span></h2>
      <button class="act" id="go-session">从一个真实观测开始</button>
      <span class="sub" id="video-status"></span>
      <div id="video-out" style="margin-top:12px; display:flex; gap:16px; flex-wrap:wrap"></div>
    </section>
  </div>
</main>

<script>
const BANDS = {0:['text','--text'],1:['motion','--motion'],2:['control','--control'],
               4:['video','--video'],5:['action','--action']};
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const colorOf = t => css((BANDS[t]||['?','--control'])[1]);
const $ = s => document.querySelector(s);
// WHICH MODEL just spoke. A student who has trained three times needs to be told;
// without it the panel is an anonymous oracle and every comparison is a guess.
const ckptLabel = c => c
  ? `<span class="sub">用的是 <b>${c.run}</b> / step ${c.step}` +
    (c.val != null ? ` · val ${c.val.toFixed(4)}` : '') + '</span>'
  : '';
const el = (t,c) => { const e=document.createElement(t); if(c) e.className=c; return e; };
const api = async (p,q={}) => {
  const u = new URL(location.origin + p);
  for (const k in q) if (q[k]!==undefined && q[k]!==null) u.searchParams.set(k,q[k]);
  const r = await fetch(u); const j = await r.json();
  if (j.error) throw new Error(j.error); return j;
};

let LINE = 'video', TAB = 'data', ROW = null, PLAY = {};

/* ------------------------------------------------------------------ 词表 */
async function drawVocab() {
  const v = await api('/api/vocab', {line: LINE});
  const box = $('#vocab'); box.innerHTML = '';
  // SCHEMATIC, not to scale. Proportionally a text band of 32750 and a control band
  // of 18 differ by three orders of magnitude, and the honest proportional picture
  // shows nothing at all about the small one. Equal segments with the numbers written
  // on them say more, and say it without a caption explaining the distortion.
  const bar = el('div');
  bar.style.cssText = 'display:flex; border-radius:4px; overflow:hidden; height:46px';
  for (const b of v.bands) {
    const seg = el('div');
    seg.style.cssText = `flex:1 1 0; background:${colorOf(b.type_id)}; color:#0b0d11;` +
      'display:flex; flex-direction:column; align-items:center; justify-content:center;' +
      'border-right:1px solid #0f1115';
    seg.innerHTML = `<b style="font-size:13px">${b.band}</b>` +
      `<span style="font-size:11px">${b.start} … ${b.end - 1}</span>`;
    bar.appendChild(seg);
  }
  box.appendChild(bar);
  $('#vocab-note').textContent =
    `这个模型认识 ${v.vocab_size} 个整数,分成上面 ${v.bands.length} 段。` +
    `示意图,不按实际长度画。每一段的起止就写在段上。`;
}

/* -------------------------------------------------------------- 选一行 */
async function loadRows() {
  const d = await api('/api/rows', {line: LINE});
  const sel = $('#row-pick'); sel.innerHTML = '';
  d.rows.forEach(r => {
    const o = el('option'); o.value = r.row; o.textContent = r.label;
    sel.appendChild(o);
  });
  sel.onchange = () => loadRow(+sel.value);
  return d;
}

/* ---------------------------------------------------------- 一行的数据 */
async function loadRow(i) {
  $('#row-label').textContent = '加载中…';
  const r = await api('/api/row', {line: LINE, i});
  ROW = r;
  $('#row-label').textContent =
    `${r.n_tokens} 个整数,其中 ${r.n_supervised} 个要算 loss(黄色)` +
    (r.n_tokens > r.cells.length ? ' · 末尾重复的 padding 已收成一格' : '');
  drawCells(r);
  drawMedia(r);
  $('#notes').innerHTML = r.notes.map(n => '· ' + n).join('<br>');
  $('#tokinfo').innerHTML = '<span>点任意一个整数,看它是什么</span>';
}

const OPEN = new Set();          // groups the reader has expanded
const HEAD = 24;                 // integers shown before a long run folds

function drawCells(r) {
  const host = $('#cells'); host.innerHTML = '';
  // How long each group is, so a 256-code frame can fold and a 28-code clip need not.
  const size = {}, rank = {};
  r.cells.forEach(c => { if (c.group) { size[c.group] = (size[c.group]||0) + 1; } });
  let seen = new Set();
  r.cells.forEach(c => {
    if (c.group) rank[c.group] = (rank[c.group] ?? -1) + 1;
    if (c.group && !seen.has(c.group)) {          // one name over the run it labels
      seen.add(c.group);
      const g = r.groups.find(x => x.key === c.group);
      const tag = el('span', 'gname'); tag.textContent = g ? g.name : c.group;
      tag.dataset.group = c.group;
      host.appendChild(tag);
    }
    // A frame is 256 integers. Showing all of them for all five frames buries the
    // pictures under twenty lines of numbers; showing none of them would hide the
    // one fact this screen exists for. So: the first two dozen, and a click for the
    // rest.
    if (c.group && size[c.group] > HEAD * 2 && !OPEN.has(c.group)) {
      const k = rank[c.group];
      if (k === HEAD) {
        const more = el('span', 'more');
        more.textContent = `… 还有 ${size[c.group] - HEAD} 个整数,点开`;
        more.onclick = () => { OPEN.add(c.group); drawCells(r); };
        host.appendChild(more);
      }
      if (k >= HEAD) return;
    }
    const d = el('div', 'cell' + (c.sup ? ' on' : '') +
                       (c.band === 'control' ? ' ctl' : ''));
    d.dataset.pos = c.pos;
    d.style.borderBottom = `2px solid ${colorOf({text:0,motion:1,control:2,video:4,action:5}[c.band] ?? 2)}`;
    const w = el('span', 'w');
    w.textContent = c.text || (c.repeat ? '' : ' ');
    const n = el('span', 'n');
    n.textContent = c.repeat ? `${c.id} ×${c.repeat}` : c.id;
    if (c.repeat) { d.classList.add('ctl'); w.textContent = c.text || ''; }
    d.appendChild(w); d.appendChild(n);
    d.onclick = () => selectCell(c.pos);
    host.appendChild(d);
  });
}

/* ------------------------------------------- 每个命名段的媒体,放在整行下面 */
function drawMedia(r) {
  const host = $('#media'); host.innerHTML = ''; PLAY = {};
  if (!Array.isArray(r.media) || !r.media.length) return;
  const wrap = el('div', 'media-row');
  const groups = r.groups.length ? r.groups
    : [{key: 'all', name: '', index: 0, band: r.kind}];
  groups.forEach(g => {
    // Which decoded frames this group is responsible for. Video: one latent frame is
    // `td` pixel frames (the first is the single given frame). Motion: the whole clip.
    let from = 0, to = r.media.length;
    if (g.band === 'video') {
      const k = +g.key.split(':')[1];
      from = k === 0 ? 0 : 1 + (k - 1) * 4; to = k === 0 ? 1 : from + 4;
    }
    const card = el('div', 'media-card');
    const cap = el('div', 'cap'); cap.textContent = g.name || '';
    // Motion has ONE card and its picture is a 3D box with a small figure inside;
    // video has five and each is a 128px frame. Sizing them the same makes one of
    // them unreadable, so they are not sized the same.
    const c = el('canvas'); c.width = c.height = (g.band === 'motion' ? 300 : 224);
    card.appendChild(cap); card.appendChild(c);
    wrap.appendChild(card);
    PLAY[g.key] = {frames: r.media.slice(from, to), canvas: c, at: 0, box: null};
  });
  host.appendChild(wrap);
  Object.keys(PLAY).forEach(k => paint(k, 0));
  clearInterval(window.__anim);
  window.__anim = setInterval(() => {
    for (const k of Object.keys(PLAY)) {
      const p = PLAY[k];
      if (p.frames.length > 1 && p.box === null) paint(k, (p.at + 1) % p.frames.length);
    }
  }, 90);
}

function paint(key, at) {
  const p = PLAY[key]; if (!p || !p.frames.length) return;
  p.at = Math.max(0, Math.min(at, p.frames.length - 1));
  const g = p.canvas.getContext('2d');
  const im = new Image();
  im.onload = () => {
    g.imageSmoothingEnabled = false;
    g.clearRect(0, 0, p.canvas.width, p.canvas.height);
    g.drawImage(im, 0, 0, p.canvas.width, p.canvas.height);
    if (p.box) {                                   // the 8x8 patch one integer owns
      const s = p.canvas.width / im.width;
      g.strokeStyle = '#ff3b30'; g.lineWidth = 2;
      g.strokeRect(p.box[0]*s, p.box[1]*s, p.box[2]*s, p.box[3]*s);
    }
  };
  im.src = p.frames[p.at];
}

async function selectCell(pos) {
  if (!ROW) return;
  const c = ROW.cells[pos], u = ROW.units[pos] || {};
  document.querySelectorAll('.cell').forEach(e =>
    e.classList.toggle('sel', +e.dataset.pos === pos));
  Object.values(PLAY).forEach(p => { p.box = null; });

  let extra = '';
  if (c.group && PLAY[c.group]) {
    const p = PLAY[c.group];
    if (u.box) {                                   // video: highlight its 8x8 patch
      p.box = u.box;
      extra = ` <span>· 第 ${u.frame} 帧,码网格 (${u.grid[0]},${u.grid[1]})</span>`;
      paint(c.group, 0);
    } else if (u.frames) {                         // motion: jump to its 4 frames
      extra = ` <span>· 覆盖第 ${u.frames[0]}–${u.frames[1]-1} 帧</span>`;
      paint(c.group, u.frames[0]);
    }
  }
  const t = await api('/api/token', {line: LINE, pos, i: ROW.row});
  $('#tokinfo').innerHTML =
    `<b>整数 ${t.id}</b> <span>· 属于</span> ` +
    `<b style="color:${colorOf(t.type_id)}">${t.band}</b> 段 ` +
    `<span>· 段内第</span> <b>${t.local_id}</b> <span>个</span>` +
    (t.control_name ? ` <span>·</span> <b>${t.control_name}</b>` : '') +
    ` <span>·</span> ${t.supervised ? '<b style="color:'+css('--sup')+'">要算 loss</b>'
                                    : '<span>不算 loss</span>'}` +
    (c.text ? ` <span>·</span> <b>${String(c.text).replace(/</g,'&lt;')}</b>` : '') +
    extra;
}

/* ---------------------------------------------------------------- 统计 */
async function drawStats() {
  const s = await api('/api/stats', {line: LINE});
  const host = $('#stats'); host.innerHTML = '';
  const t = el('table');
  const pct = 100*s.supervised/s.total;
  t.innerHTML = `<tr><th>每段有多少整数</th><td>` +
    Object.entries(s.by_band).map(([k,v]) => `${k} ${v.toLocaleString()}`).join(' · ') +
    `</td></tr><tr><th>要算 loss 的</th><td>${s.supervised.toLocaleString()} / ` +
    `${s.total.toLocaleString()} (${pct.toFixed(1)}%)</td></tr>` +
    (s.code_vocab ? `<tr><th>这一批用到的码</th><td>${s.code_vocab.used.toLocaleString()}` +
      ` 个不同的码 / 一共 ${s.code_vocab.total.toLocaleString()} 个(抽了 ` +
      `${s.code_vocab.drawn.toLocaleString()} 次)</td></tr>` : '');
  host.appendChild(t);
  if (s.actions) {
    const max = Math.max(...s.actions.map(a=>a.count)) || 1;
    const w = el('div'); w.style.marginTop='10px';
    w.innerHTML = '<div class="sub">动作分布</div>';
    for (const a of s.actions) {
      const r = el('div'); r.style.cssText='display:flex; gap:8px; align-items:center';
      r.innerHTML = `<span class="sub" style="width:88px">${a.name}</span>` +
        `<span class="bar" style="width:${240*a.count/max}px; background:${css('--action')}"></span>` +
        `<span class="sub">${a.count}</span>`;
      w.appendChild(r);
    }
    host.appendChild(w);
  }
}

/* ---------------------------------------------------------------- 推理 */
let CKPT = null;          // null = "let the server pick the best"

async function loadCheckpoints() {
  const sel = $('#ckpt-pick'); sel.innerHTML = ''; CKPT = null;
  try {
    const d = await api('/api/checkpoints', {line: LINE});
    if (!d.checkpoints.length) {
      sel.innerHTML = '<option>还没有 checkpoint —— 先训一个</option>';
      $('#ckpt-note').textContent = ''; return;
    }
    sel.innerHTML = d.checkpoints.map((c,i) =>
      `<option value="${c.path}">${c.run} / step ${c.step}` +
      (c.val != null ? ` · val ${c.val.toFixed(4)}` : '') +
      (c.tags.length ? `  ${c.tags.join(' ')}` : '') + '</option>').join('');
    CKPT = d.checkpoints[0].path;
    const mark = () => {
      const c = d.checkpoints.find(x => x.path === sel.value);
      // Literal match on a tag written by play.list_checkpoints(). Renaming it there
      // without changing it here removes this warning with no error of any kind.
      $('#ckpt-note').innerHTML = c && c.tags.includes('末尾')
        ? '<b style="color:#ff9f43">这是过拟合的那一端 —— 同样的数据、同样的配方,只是训久了</b>'
        : '';
    };
    sel.onchange = () => { CKPT = sel.value; mark(); };
    mark();
  } catch (e) { sel.innerHTML = `<option>${e.message}</option>`; }
}

async function playTab() {
  ['text','motion','video'].forEach(l =>
    $('#play-' + l).classList.toggle('hide', l !== LINE));
  await loadCheckpoints();
  if (LINE === 'motion') {
    try {
      const p = await api('/api/gen/prompts');
      // TWO GROUPS, and the split is the lesson: a caption from the training set that
      // generates beautifully is memorisation. Both kinds sit in one menu so the
      // comparison is one click apart.
      const grp = (label, items) => items.length
        ? `<optgroup label="${label}">` +
          items.map(x => `<option>${x.caption.replace(/</g,'&lt;')}</option>`).join('') +
          '</optgroup>' : '';
      const inT = p.prompts.filter(x => x.in_training);
      const notT = p.prompts.filter(x => !x.in_training);
      $('#prompt-list').innerHTML =
        '<span class="sub">挑一句:</span> <select id="p-pick" style="max-width:560px">' +
        '<option value="">— 自己输入 —</option>' +
        grp(`训练集里没有这句(${notT.length})`, notT) +
        grp(`⚠ 训练集里就有这句 — 生成得好是「记住了」(${inT.length})`, inT) +
        '</select> <span class="sub" id="p-mark"></span>';
      const known = new Set(inT.map(x => x.caption));
      $('#p-pick').onchange = (e) => {
        const v = e.target.value;
        if (!v) { $('#p-mark').textContent = ''; return; }
        $('#p-motion').value = v;
        $('#p-mark').innerHTML = known.has(v)
          ? '<b style="color:var(--sup)">⚠ 这句训练时见过</b>'
          : '训练集里没有这句';
      };
    } catch (e) { $('#prompt-list').innerHTML = `<span class="err">${e.message}</span>`; }
  }
}

$('#go-text').onclick = async () => {
  $('#text-status').textContent = '生成中…';
  try {
    const r = await api('/api/gen/text', {prompt: $('#p-text').value, max_new: 100, ckpt: CKPT});
    const box = $('#out-text'); box.innerHTML = '';
    const head = el('i'); head.style.color = css('--dim'); head.textContent = r.prompt;
    box.appendChild(head);
    r.units.forEach(u => {
      const w = el('i'); w.textContent = (r.text||'').slice(u.range[0], u.range[1]) || '​';
      box.appendChild(w);
    });
    $('#text-status').innerHTML = `${r.n_tokens} token · ${ckptLabel(r.checkpoint)}`;
  } catch (e) { $('#text-status').innerHTML = `<span class="err">${e.message}</span>`; }
};

$('#go-motion').onclick = async () => {
  $('#motion-status').textContent = '生成中…';
  try {
    const r = await api('/api/gen/motion', {caption: $('#p-motion').value, ckpt: CKPT});
    const box = $('#motion-out'); box.innerHTML = '';
    const frames = r.media || [];
    const c = el('canvas'); c.width = 300; c.height = 300; c.id='mstage';
    box.appendChild(c);
    const info = el('div','note'); info.innerHTML = r.notes.map(n=>'· '+n).join('<br>');
    box.appendChild(info);
    let k = 0;
    const g = c.getContext('2d');
    const tick = () => { if (!frames.length) return;
      const im = new Image();
      im.onload = () => { g.clearRect(0,0,300,300); g.drawImage(im,0,0,300,300); };
      im.src = frames[k % frames.length]; k++; };
    clearInterval(window.__m); window.__m = setInterval(tick, 60); tick();
    $('#motion-status').innerHTML = `${frames.length} 帧 · ${ckptLabel(r.checkpoint)}`;
  } catch (e) { $('#motion-status').innerHTML = `<span class="err">${e.message}</span>`; }
};

/* ------------------------------------------------- 视频:无限 rollout + 键盘 */
// 按键 -> 动作 id。用 WASD/方向键,因为学生的手已经知道往哪放;空格开火,
// 松开所有键就是 NOOP —— 而 NOOP 是动作表 v2 专门补的那一个"真正站住不动"。
const KEYMAP = {
  KeyW:8, ArrowUp:8, KeyA:5, ArrowLeft:5, KeyD:2, ArrowRight:2,
  KeyQ:0, KeyE:1, Space:17, KeyS:18,
};
let SESSION = null, VFRAMES = [], HELD = new Set(), BUSY = false, LOOP = null;
const MAXKEEP = 96;                        // 画面只留最近这些帧,rollout 是无限的

$('#go-session').onclick = async () => {
  $('#video-status').textContent = '加载模型…';
  try {
    const r = await api('/api/session/new', {ckpt: CKPT});
    SESSION = r.id; VFRAMES = r.media.slice();
    renderSession(r.actions);
    $('#video-status').innerHTML = ckptLabel(r.checkpoint);
    startLoop();
  } catch (e) { $('#video-status').innerHTML = `<span class="err">${e.message}</span>`; }
};

function renderSession(actions) {
  const box = $('#video-out'); box.innerHTML = '';
  const c = el('canvas'); c.width = 384; c.height = 384; c.id = 'vstage';
  box.appendChild(c);
  const side = el('div'); side.style.minWidth = '260px';
  side.innerHTML =
    '<div class="note">按住方向键走,松手就停。世界会一直生成下去 ——' +
    '窗口满了自动<b>重锚</b>(把上一窗口末尾几帧的码原样搬进新窗口,不经过 codec 往返)。</div>' +
    '<div class="note" style="margin-top:6px">W/↑ 前进 · A/← 左平移 · D/→ 右平移 · ' +
    'Q 左转 · E 右转 · 空格 开火 · S 站住不动</div>';
  const keys = el('div', 'keys'); keys.style.marginTop = '8px';
  for (const [name, id] of [['FWD',8],['TL',0],['TR',1],['ML',5],['MR',2],['ATK',17],['NOOP',18]]) {
    const b = el('button', 'act'); b.textContent = name;
    b.onmousedown = () => { HELD.add(id); };
    b.onmouseup = b.onmouseleave = () => { HELD.delete(id); };
    keys.appendChild(b);
  }
  side.appendChild(keys);
  const st = el('div', 'note'); st.id = 'vstat'; side.appendChild(st);
  box.appendChild(side);
  showV(VFRAMES.length - 1);
}

// The rollout is PULL: one request per frame, and the next only goes out when the
// last has arrived. At ~250 ms a frame there is no clock to run ahead of, so this
// needs no backpressure, no socket and no reconnect logic — the loop IS the
// backpressure. Holding a key just means the next request carries that action.
function startLoop() {
  clearInterval(LOOP);
  LOOP = setInterval(async () => {
    if (BUSY || !SESSION) return;
    const action = HELD.size ? [...HELD][HELD.size - 1] : 18;   // nothing held = NOOP
    BUSY = true;
    const t0 = performance.now();
    try {
      const r = await api('/api/session/step', {id: SESSION, action});
      VFRAMES = VFRAMES.concat(r.media).slice(-MAXKEEP);
      showV(VFRAMES.length - 1);
      $('#vstat').innerHTML =
        `${r.action} · ${Math.round(performance.now()-t0)} ms/帧 · ` +
        `第 ${r.frame} 帧 · 重锚 ${r.reanchors} 次`;
    } catch (e) {
      $('#vstat').innerHTML = `<span class="err">${e.message}</span>`;
      clearInterval(LOOP);
    } finally { BUSY = false; }
  }, 60);
}

addEventListener('keydown', (e) => {
  if (TAB !== 'play' || LINE !== 'video' || !SESSION) return;
  if (KEYMAP[e.code] === undefined) return;
  e.preventDefault(); HELD.add(KEYMAP[e.code]);
});
addEventListener('keyup', (e) => {
  if (KEYMAP[e.code] !== undefined) HELD.delete(KEYMAP[e.code]);
});

function showV(i) {
  const c = $('#vstage'); if (!c || !VFRAMES.length) return;
  const g = c.getContext('2d');
  const im = new Image();
  im.onload = () => { g.imageSmoothingEnabled = false; g.drawImage(im,0,0,384,384); };
  im.src = VFRAMES[Math.max(0, Math.min(i, VFRAMES.length-1))];
}

/* ---------------------------------------------------------------- 路由 */
async function refresh() {
  document.querySelectorAll('.lines button').forEach(b =>
    b.classList.toggle('on', b.dataset.line === LINE));
  $('#tab-data').classList.toggle('on', TAB === 'data');
  $('#tab-play').classList.toggle('on', TAB === 'play');
  $('#pane-data').classList.toggle('hide', TAB !== 'data');
  $('#pane-play').classList.toggle('hide', TAB !== 'play');
  try {
    if (TAB === 'data') {
      await drawVocab(); await loadRows(); await loadRow(0); await drawStats();
    } else { await playTab(); }
  } catch (e) {
    $('#vocab').innerHTML = `<div class="err">${e.message}</div>`;
  }
}
document.querySelectorAll('.lines button').forEach(b =>
  b.onclick = () => { LINE = b.dataset.line; refresh(); });
$('#tab-data').onclick = () => { TAB='data'; refresh(); };
$('#tab-play').onclick = () => { TAB='play'; refresh(); };
refresh();
</script>
